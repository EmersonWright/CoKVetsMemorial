<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Veterans Memorial Park</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1c2c;
    color: white;
}

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 80px;
    text-align: center;
    background: linear-gradient(#0b1c2c, #081520);
    padding-top: 10px;
    z-index: 1000;
}

.title {
    font-size: 24px;
    font-weight: bold;
}

.subtitle {
    font-size: 14px;
    opacity: 0.7;
}

.sidebar-left {
    position: absolute;
    left: 0;
    top: 80px;
    bottom: 0;
    width: 260px;
    background: rgba(10,25,40,0.95);
    padding: 10px;
    overflow-y: auto;
}

.sidebar-right {
    position: absolute;
    right: 0;
    top: 80px;
    bottom: 0;
    width: 300px;
    background: rgba(10,25,40,0.95);
    padding: 20px;
}

#map {
    position: absolute;
    top: 80px;
    left: 260px;
    right: 300px;
    bottom: 0;
}

.section-item {
    padding: 10px;
    border-bottom: 1px solid #1e3a5f;
    cursor: pointer;
}

.section-item:hover {
    background: #163454;
}

.paver {
    cursor: pointer;
}

.occupied {
    fill: rgba(0,255,100,0.7);
    stroke: #00ff88;
}

.available {
    fill: rgba(80,80,80,0.4);
    stroke: #888;
}

.leaflet-container {
    background: black;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="title">VETERANS MEMORIAL PARK</div>
    <div class="subtitle">PAVER MAP & DIRECTORY</div>
</div>

<div class="sidebar-left" id="sections"></div>
<div id="map"></div>

<div class="sidebar-right" id="details">
    <h2>Selected Paver</h2>
    <p>Click a paver</p>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2
});

const width = 2000;
const height = 2000;

const bounds = [[0,0],[height,width]];

// Your park image
L.imageOverlay('park.png', bounds).addTo(map);
map.fitBounds(bounds);

let allPavers = [];

fetch('pavers.json')
.then(res => res.json())
.then(data => {
    allPavers = data;
    drawPavers(data);
    buildSections(data);
});


// ================================
// PERFECTED SECTION LAYOUT
// ================================

// These are tuned to resemble your pentagon layout
const SECTION_LAYOUT = {
    "ALPHA 1": { cx: 750, cy: 450, angle: -160 },
    "ALPHA 2": { cx: 1250, cy: 450, angle: -20 },

    "BRAVO 1": { cx: 500, cy: 800, angle: -120 },
    "BRAVO 2": { cx: 1500, cy: 800, angle: 120 },

    "CHARLIE 1": { cx: 550, cy: 1200, angle: -70 },
    "CHARLIE 2": { cx: 1450, cy: 1200, angle: 70 },

    "DELTA 1": { cx: 750, cy: 1500, angle: -30 },
    "DELTA 2": { cx: 1250, cy: 1500, angle: 30 },

    "ECHO 1": { cx: 900, cy: 1750, angle: 0 },
    "ECHO 2": { cx: 1100, cy: 1750, angle: 0 }
};


// ================================
// DRAW PAVERS WITH ROTATION
// ================================
function drawPavers(data) {

    data.forEach(p => {

        if (!SECTION_LAYOUT[p.SECTION]) return;

        const layout = SECTION_LAYOUT[p.SECTION];

        const rowIndex = p.ROW.charCodeAt(0) - 65;
        const spacing = 18;

        let x = (p.NUMBER * spacing);
        let y = (rowIndex * spacing);

        // Rotate layout for angled sections
        const angleRad = layout.angle * Math.PI / 180;

        const rotatedX = x * Math.cos(angleRad) - y * Math.sin(angleRad);
        const rotatedY = x * Math.sin(angleRad) + y * Math.cos(angleRad);

        const finalX = layout.cx + rotatedX;
        const finalY = layout.cy + rotatedY;

        const rect = L.rectangle([
            [finalY, finalX],
            [finalY + 14, finalX + 14]
        ], {
            className: p.NAME ? "occupied" : "available",
            weight: 1
        }).addTo(map);

        rect.on('click', () => showDetails(p));
    });
}


// ================================
// DETAILS PANEL
// ================================
function showDetails(p) {
    document.getElementById('details').innerHTML = `
        <h2>${p.NAME || "Available"}</h2>

        <p><b>Section:</b> ${p.SECTION}</p>
        <p><b>Row:</b> ${p.ROW}</p>
        <p><b>Number:</b> ${p.NUMBER}</p>

        <hr>

        <p><b>Branch:</b> ${p.BRANCH || "-"}</p>
        <p><b>Years:</b> ${p["YEARS SERVED"] || "-"}</p>
        <p><b>War:</b> ${p["WAR & AWARDS"] || "-"}</p>
        <p><b>Rank:</b> ${p["RANK INFORMATION"] || "-"}</p>
    `;
}


// ================================
// LEFT PANEL
// ================================
function buildSections(data) {

    const counts = {};

    data.forEach(p => {
        counts[p.SECTION] = (counts[p.SECTION] || 0) + 1;
    });

    const container = document.getElementById('sections');

    Object.keys(counts).forEach(sec => {

        const div = document.createElement('div');
        div.className = "section-item";
        div.innerHTML = `${sec} <span style="float:right">${counts[sec]}</span>`;

        div.onclick = () => zoomToSection(sec);

        container.appendChild(div);
    });
}


// ================================
// ZOOM TO SECTION
// ================================
function zoomToSection(section) {

    const l = SECTION_LAYOUT[section];

    map.fitBounds([
        [l.cy - 300, l.cx - 300],
        [l.cy + 300, l.cx + 300]
    ]);
}

</script>

</body>
</html>
