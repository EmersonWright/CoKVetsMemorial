<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Veterans Memorial Park</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1c2c;
    color: white;
}

/* HEADER */
.topbar {
    height: 80px;
    text-align: center;
    background: linear-gradient(#0b1c2c, #081520);
    padding-top: 10px;
}

.title { font-size: 24px; font-weight: bold; }
.subtitle { font-size: 14px; }

/* LAYOUT */
.container {
    display: flex;
    height: calc(100vh - 80px);
}

.left, .right {
    width: 260px;
    background: #081520;
    padding: 10px;
    overflow-y: auto;
}

.center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* MAP */
.map {
    position: relative;
    width: 900px;
    height: 700px;
}

/* PAVER */
.paver {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #00ff88;
    cursor: pointer;
}

.available {
    background: gray;
}

.paver:hover {
    background: #00ffaa;
}

/* SEARCH */
.search {
    width: 100%;
    padding: 6px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="title">VETERANS MEMORIAL PARK</div>
    <div class="subtitle">PAVER MAP & DIRECTORY</div>
</div>

<div class="container">

<div class="left">
    <input class="search" id="search" placeholder="Search...">
</div>

<div class="center">
    <div id="map" class="map"></div>
</div>

<div class="right" id="details">
    <h2>Select a Paver</h2>
</div>

</div>

<script>

let DATA = [];

// =======================
// SECTION GEOMETRY
// =======================
const CONFIG = {

  "ALPHA 1": { x:500, y:50, angle:-20 },
  "ALPHA 2": { x:300, y:50, angle:20 },

  "BRAVO 1": { x:100, y:150, angle:60 },
  "BRAVO 2": { x:100, y:320, angle:120 },

  "CHARLIE 1": { x:200, y:520, angle:160 },
  "CHARLIE 2": { x:380, y:600, angle:200 },

  "DELTA 1": { x:550, y:600, angle:340 },
  "DELTA 2": { x:700, y:480, angle:20 },

  "ECHO 1": { x:750, y:300, angle:0 },
  "ECHO 2": { x:750, y:150, angle:-10 }
};


// =======================
// LOAD DATA
// =======================
fetch('pavers.json')
.then(r=>r.json())
.then(d=>{
    DATA = d;
    draw(d);
});


// =======================
// DRAW REAL ANGLED ROWS
// =======================
function draw(data){

    const map = document.getElementById("map");
    map.innerHTML = "";

    data.forEach(p=>{

        const cfg = CONFIG[p.SECTION];
        if(!cfg) return;

        const row = p.ROW.charCodeAt(0) - 65;
        const col = p.NUMBER;

        const spacing = 12;

        const angle = cfg.angle * Math.PI/180;

        // Direction vectors
        const rowDx = Math.cos(angle);
        const rowDy = Math.sin(angle);

        const perpDx = Math.cos(angle + Math.PI/2);
        const perpDy = Math.sin(angle + Math.PI/2);

        const x = cfg.x + rowDx * col * spacing + perpDx * row * spacing;
        const y = cfg.y + rowDy * col * spacing + perpDy * row * spacing;

        const div = document.createElement("div");
        div.className = "paver";

        if(!p.NAME) div.classList.add("available");

        div.style.left = x + "px";
        div.style.top = y + "px";

        div.onclick = ()=>show(p);

        map.appendChild(div);
    });
}


// =======================
// DETAILS PANEL
// =======================
function show(p){
    document.getElementById("details").innerHTML = `
        <h2>${p.NAME || "Available"}</h2>
        <p><b>${p.SECTION}</b></p>
        <p>Row ${p.ROW} | #${p.NUMBER}</p>
        <hr>
        <p>${p.BRANCH || ""}</p>
        <p>${p["YEARS SERVED"] || ""}</p>
        <p>${p["WAR & AWARDS"] || ""}</p>
    `;
}


// =======================
// SEARCH
// =======================
document.getElementById("search").addEventListener("input", e=>{
    const term = e.target.value.toLowerCase();

    draw(
        term
        ? DATA.filter(p => p.NAME && p.NAME.toLowerCase().includes(term))
        : DATA
    );
});

</script>

</body>
</html>
