<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Veterans Memorial Park</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1c2c;
    color: white;
}

/* HEADER */
.topbar {
    height: 80px;
    text-align: center;
    background: linear-gradient(#0b1c2c, #081520);
    padding-top: 10px;
}

.container {
    display: flex;
    height: calc(100vh - 80px);
}

.left, .right {
    width: 260px;
    background: #081520;
    padding: 10px;
    overflow-y: auto;
}

.center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.map {
    position: relative;
    width: 900px;
    height: 700px;
}

/* PAVERS */
.paver {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #00ff88;
    cursor: pointer;
}

.available { background: gray; }

.paver:hover {
    background: #00ffaa;
}

/* ROW LABELS */
.label {
    position: absolute;
    font-size: 10px;
}

/* SEARCH */
.search {
    width: 100%;
    padding: 6px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="topbar">
    <div style="font-size:24px;font-weight:bold;">VETERANS MEMORIAL PARK</div>
    <div>PAVER MAP & DIRECTORY</div>
</div>

<div class="container">

<div class="left">
    <input id="search" class="search" placeholder="Search...">
</div>

<div class="center">
    <div id="map" class="map"></div>
</div>

<div class="right" id="details">
    <h2>Select a Paver</h2>
</div>

</div>

<script>

// ===================================
// SECTION POSITIONS + EDGE DIRECTIONS
// ===================================
const CONFIG = {

  "ALPHA 1": { x:520, y:90, angle:180 },
  "ALPHA 2": { x:320, y:90, angle:180 },

  "BRAVO 1": { x:140, y:180, angle:240 },
  "BRAVO 2": { x:140, y:360, angle:280 },

  "CHARLIE 1": { x:260, y:540, angle:320 },
  "CHARLIE 2": { x:420, y:620, angle:20 },

  "DELTA 1": { x:600, y:620, angle:20 },
  "DELTA 2": { x:740, y:500, angle:60 },

  "ECHO 1": { x:780, y:320, angle:100 },
  "ECHO 2": { x:780, y:180, angle:140 }
};

let DATA = [];

fetch('pavers.json')
.then(r=>r.json())
.then(d=>{
    DATA = d;
    draw(d);
});


// ===================================
// ✅ BUILD REAL SHAPES FROM DATA
// ===================================
function draw(data){

    const map = document.getElementById("map");
    map.innerHTML = "";

    const grouped = {};

    // group by section → row
    data.forEach(p=>{
        if(!grouped[p.SECTION]) grouped[p.SECTION] = {};
        if(!grouped[p.SECTION][p.ROW]) grouped[p.SECTION][p.ROW] = [];
        grouped[p.SECTION][p.ROW].push(p);
    });

    for(const section in grouped){

        const cfg = CONFIG[section];
        if(!cfg) continue;

        const rows = Object.keys(grouped[section]).sort();

        const angle = cfg.angle * Math.PI/180;
        const spacing = 12;

        const edgeDx = Math.cos(angle);
        const edgeDy = Math.sin(angle);

        const outDx = Math.cos(angle - Math.PI/2);
        const outDy = Math.sin(angle - Math.PI/2);

        rows.forEach((rowLetter, rowIndex)=>{

            const rowItems = grouped[section][rowLetter];

            // ✅ SORT BY NUMBER
            rowItems.sort((a,b)=>a.NUMBER - b.NUMBER);

            const rowWidth = rowItems.length;

            // ✅ CENTER ROW
            rowItems.forEach((p, i)=>{

                const centeredCol = i - rowWidth/2;

                const x = cfg.x 
                        + edgeDx * centeredCol * spacing
                        + outDx * rowIndex * spacing;

                const y = cfg.y 
                        + edgeDy * centeredCol * spacing
                        + outDy * rowIndex * spacing;

                const div = document.createElement("div");
                div.className = "paver";

                if(!p.NAME) div.classList.add("available");

                div.style.left = x + "px";
                div.style.top = y + "px";

                div.onclick = ()=>show(p);

                map.appendChild(div);
            });

            // ✅ ROW LABEL
            const lx = cfg.x + outDx * rowIndex * spacing;
            const ly = cfg.y + outDy * rowIndex * spacing;

            const label = document.createElement("div");
            label.className = "label";
            label.innerText = rowLetter;

            label.style.left = (lx - 12) + "px";
            label.style.top = (ly - 6) + "px";

            map.appendChild(label);

        });
    }
}


// ===================================
// DETAILS PANEL
// ===================================
function show(p){
    document.getElementById("details").innerHTML = `
        <h2>${p.NAME || "Available"}</h2>
        <p><b>${p.SECTION}</b></p>
        <p>Row ${p.ROW} | #${p.NUMBER}</p>
        <hr>
        <p>${p.BRANCH || ""}</p>
        <p>${p["YEARS SERVED"] || ""}</p>
        <p>${p["WAR & AWARDS"] || ""}</p>
    `;
}


// ===================================
// SEARCH
// ===================================
document.getElementById("search").addEventListener("input", e=>{
    const term = e.target.value.toLowerCase();

    draw(
        term
        ? DATA.filter(p => p.NAME && p.NAME.toLowerCase().includes(term))
        : DATA
    );
});

</script>

</body>
</html>
