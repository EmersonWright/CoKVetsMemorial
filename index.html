<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Veterans Memorial Park</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1c2c;
    color: white;
}

.topbar {
    height: 80px;
    text-align: center;
    background: linear-gradient(#0b1c2c, #081520);
    padding-top: 10px;
}

.container {
    display: flex;
    height: calc(100vh - 80px);
}

.left, .right {
    width: 260px;
    background: #081520;
    padding: 10px;
}

.center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.map {
    position: relative;
    width: 800px;
    height: 800px;
}

.paver {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #00ff88;
}

.available { background: gray; }

.label {
    position: absolute;
    font-size: 10px;
}
</style>
</head>

<body>

<div class="topbar">
    <div style="font-size:24px;font-weight:bold;">VETERANS MEMORIAL PARK</div>
    <div>PAVER MAP & DIRECTORY</div>
</div>

<div class="container">
<div class="left">
    <input id="search" placeholder="Search...">
</div>

<div class="center">
    <div id="map" class="map"></div>
</div>

<div class="right" id="details">
<h2>Select a Paver</h2>
</div>
</div>

<script>

let DATA=[];

fetch('pavers.json')
.then(r=>r.json())
.then(d=>{
    DATA=d;
    draw(DATA);
});

// ======================
// PENTAGON GEOMETRY
// ======================
const centerX = 400;
const centerY = 400;
const sides = 5;

// Generates pentagon points
function pentagon(radius){
    const pts=[];
    for(let i=0;i<sides;i++){
        const angle = (Math.PI*2/sides)*i - Math.PI/2;
        pts.push([
            centerX + Math.cos(angle)*radius,
            centerY + Math.sin(angle)*radius
        ]);
    }
    return pts;
}

// ======================
// SECTION MAPPING
// ======================
const ORDER = [
 "ALPHA 2","ALPHA 1",
 "ECHO 2","ECHO 1",
 "DELTA 2","DELTA 1",
 "CHARLIE 2","CHARLIE 1",
 "BRAVO 2","BRAVO 1"
];

// ======================
// DRAW CORRECTLY
// ======================
function draw(data){

    const map=document.getElementById("map");
    map.innerHTML="";

    // group by section + row
    const grouped={};

    data.forEach(p=>{
        if(!grouped[p.SECTION]) grouped[p.SECTION]={};
        if(!grouped[p.SECTION][p.ROW]) grouped[p.SECTION][p.ROW]=[];
        grouped[p.SECTION][p.ROW].push(p);
    });

    // get max rows
    const rows = [...new Set(data.map(p=>p.ROW))].sort();

    rows.forEach((rowLetter,rowIndex)=>{

        const inner = pentagon(120 + rowIndex*14);

        inner.forEach((pt,i)=>{

            const next = inner[(i+1)%inner.length];

            // get sections mapping
            const s1 = ORDER[i*2];
            const s2 = ORDER[i*2+1];

            drawSectionRow(grouped[s1],rowLetter,pt,next,map,true);
            drawSectionRow(grouped[s2],rowLetter,pt,next,map,false);

        });

    });
}


// ======================
// DRAW SINGLE SECTION ROW
// ======================
function drawSectionRow(sec,row,pt1,pt2,map,flip){

    if(!sec || !sec[row]) return;

    const items = sec[row].sort((a,b)=>a.NUMBER-b.NUMBER);

    const dx = pt2[0]-pt1[0];
    const dy = pt2[1]-pt1[1];

    const len = Math.sqrt(dx*dx+dy*dy);

    const ux = dx/len;
    const uy = dy/len;

    const spacing = 10;

    items.forEach((p,i)=>{

        const index = flip ? i : (items.length-i);

        const x = pt1[0] + ux * index * spacing;
        const y = pt1[1] + uy * index * spacing;

        const div=document.createElement("div");
        div.className="paver";

        if(!p.NAME) div.classList.add("available");

        div.style.left=x+"px";
        div.style.top=y+"px";

        map.appendChild(div);
    });
}

</script>
</body>
</html>
